<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>방유찬 | 모두닥 세일즈팀</title>
<meta name="description" content="백내장 정보 불균형을 해결하고 있는 모두닥 세일즈팀 방유찬입니다.">
<meta name="theme-color" content="#EFEAFD">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='28' fill='%235B3DF5'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='800'%3E%EC%9C%A0%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* ---------- 디자인 토큰 ---------- */
  :root{
    color-scheme:light;
    --bg:#EFEAFD;
    --surface:#FFFFFF;
    --border:#E9E7F2;
    --text:#16141F;
    --text-2:#5B5870;
    --text-3:#8E8BA3;
    --accent:#5B3DF5;
    --accent-soft:#EEEBFF;
    --highlight:rgba(91,61,245,.18);
    --glow-1:rgba(91,61,245,.14);
    --glow-2:rgba(140,110,255,.14);
    --shadow:0 1px 2px rgba(22,20,31,.04), 0 10px 28px -14px rgba(22,20,31,.14);
    --radius:24px;

    --food-bg:#FFF1E6; --food-fg:#E0661B;
    --chat-bg:#EEEBFF; --chat-fg:#5B3DF5;
    --song-bg:#FFEAF2; --song-fg:#D63A7A;
  }
  /* ---------- 기본 ---------- */
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
    word-break:keep-all;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100svh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:max(48px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed;
    inset:-10vh -10vw auto -10vw;
    height:70vh;
    background:
      radial-gradient(45% 55% at 25% 35%, var(--glow-1), transparent 70%),
      radial-gradient(40% 50% at 80% 20%, var(--glow-2), transparent 70%);
    pointer-events:none;
    z-index:0;
  }
  main{
    position:relative;
    z-index:1;
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  /* ---------- 히어로 ---------- */
  .hero{
    text-align:center;
    padding:8px 0 20px;
  }
  .avatar{
    display:block;
    width:96px;height:96px;
    margin:0 auto 22px;
    border-radius:50%;
    object-fit:cover;
    background:linear-gradient(140deg,#8B6EFF 0%,#5B3DF5 55%,#3E22C9 100%);
    box-shadow:0 0 0 6px var(--surface), 0 14px 32px -10px rgba(91,61,245,.55);
  }
  .eyebrow{
    font-size:15px;
    font-weight:500;
    color:var(--text-2);
    margin-bottom:2px;
  }
  .name{
    font-size:clamp(36px, 10vw, 46px);
    font-weight:800;
    letter-spacing:-.035em;
    line-height:1.2;
  }
  .team{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:14px;
    padding:7px 14px;
    border-radius:999px;
    background:var(--surface);
    border:1px solid var(--border);
    font-size:14px;
    font-weight:600;
    color:var(--text-2);
  }
  .team .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--accent);
  }

  /* ---------- 인사하기 ---------- */
  .greet{
    margin-top:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .greet__btn{
    appearance:none;
    border:0;
    cursor:pointer;
    font:inherit;
    display:inline-flex;
    align-items:center;
    gap:8px;
    min-height:44px;
    padding:11px 22px;
    border-radius:999px;
    background:var(--accent);
    color:#fff;
    font-size:15px;
    font-weight:700;
    letter-spacing:-.01em;
    box-shadow:0 8px 20px -8px rgba(91,61,245,.6);
    transition:transform .15s ease, background-color .2s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .greet__btn svg{width:18px;height:18px}
  @media (hover:hover){
    .greet__btn:hover{background:#4A2DE0;transform:translateY(-1px)}
  }
  .greet__btn:active{transform:scale(.97)}
  .greet__btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  /* 말풍선 영역: 닫혀 있을 땐 높이 0, 열리면 부드럽게 펼쳐짐 */
  .greet__reveal{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows .4s cubic-bezier(.2,.7,.2,1);
  }
  .greet__reveal.is-open{grid-template-rows:1fr}
  .greet__inner{overflow:hidden;min-height:0}
  .greet__pad{padding:16px 24px 18px}
  .greet__msg{
    position:relative;
    display:inline-block;
    padding:10px 20px;
    border-radius:16px;
    background:var(--surface);
    color:var(--accent);
    font-size:17px;
    font-weight:700;
    letter-spacing:-.01em;
    box-shadow:var(--shadow);
  }
  .greet__msg::before{
    content:"";
    position:absolute;
    top:-5px;
    left:50%;
    width:12px;height:12px;
    background:var(--surface);
    border-radius:2px;
    transform:translateX(-50%) rotate(45deg);
  }
  .greet__msg.pop{animation:pop .45s cubic-bezier(.3,1.5,.5,1) both}
  @keyframes pop{
    from{opacity:0;transform:scale(.85) translateY(-4px)}
    to{opacity:1;transform:none}
  }

  /* ---------- 카드 ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:26px 24px 28px;
    box-shadow:var(--shadow);
  }
  .card__head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .label{
    font-size:13px;
    font-weight:700;
    color:var(--accent);
    letter-spacing:.02em;
  }
  .badge{
    width:36px;height:36px;
    border-radius:12px;
    display:grid;place-items:center;
    background:var(--accent-soft);
    color:var(--accent);
  }
  .badge svg{width:20px;height:20px}

  .statement{
    font-size:clamp(22px, 6.2vw, 26px);
    font-weight:700;
    line-height:1.45;
    letter-spacing:-.025em;
  }
  .statement mark{
    color:inherit;
    background:linear-gradient(transparent 60%, var(--highlight) 60%);
    padding:0 2px;
  }

  /* ---------- 좋아하는 것 ---------- */
  .likes{
    list-style:none;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
  }
  .like{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    padding:20px 6px 18px;
    border-radius:18px;
    background:var(--tile-bg);
    transition:transform .25s cubic-bezier(.2,.7,.2,1);
  }
  .like--food{--tile-bg:var(--food-bg);--tile-fg:var(--food-fg)}
  .like--chat{--tile-bg:var(--chat-bg);--tile-fg:var(--chat-fg)}
  .like--song{--tile-bg:var(--song-bg);--tile-fg:var(--song-fg)}
  .like__icon{
    width:46px;height:46px;
    border-radius:50%;
    display:grid;place-items:center;
    background:var(--surface);
    color:var(--tile-fg);
    flex-shrink:0;
  }
  .like__icon svg{width:22px;height:22px}
  .like__text{
    font-size:15px;
    font-weight:600;
    letter-spacing:-.01em;
    white-space:nowrap;
  }
  @media (hover:hover){
    .like:hover{transform:translateY(-3px)}
  }

  /* 아주 좁은 화면에서는 세로 목록으로 */
  @media (max-width:359px){
    .likes{grid-template-columns:1fr}
    .like{flex-direction:row;padding:12px 16px;gap:14px}
    .like__icon{width:40px;height:40px}
  }

  /* ---------- 풀고 싶은 문제 ---------- */
  .problem__title{
    font-size:clamp(19px, 5.4vw, 21px);
    font-weight:700;
    line-height:1.45;
    letter-spacing:-.02em;
    margin-bottom:18px;
  }
  .nowrap{white-space:nowrap}
  .problem__step{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:8px;
    padding:16px 18px;
    border-radius:16px;
    background:#F5F4F8;
  }
  .problem__step--goal{background:var(--accent-soft)}
  .problem__step p{
    font-size:15px;
    line-height:1.6;
    color:var(--text-2);
  }
  .problem__step--goal p{
    color:var(--text);
    font-weight:600;
  }
  .tag{
    font-size:12px;
    font-weight:700;
    padding:3px 10px;
    border-radius:999px;
    background:var(--surface);
    color:var(--text-3);
  }
  .problem__step--goal .tag{color:var(--accent)}
  .problem__arrow{
    display:grid;
    place-items:center;
    height:28px;
    color:var(--text-3);
  }
  .problem__arrow svg{width:18px;height:18px}

  /* ---------- 푸터 ---------- */
  footer{
    text-align:center;
    font-size:13px;
    color:var(--text-3);
    padding-top:12px;
  }

  /* ---------- 등장 애니메이션 ---------- */
  .reveal{
    animation:rise .7s cubic-bezier(.2,.7,.2,1) both;
    animation-delay:calc(var(--d, 0) * 90ms);
  }
  @keyframes rise{
    from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:none}
  }
  @media (prefers-reduced-motion: reduce){
    .reveal{animation:none}
    .like{transition:none}
    .greet__btn,.greet__reveal{transition:none}
    .greet__msg.pop{animation:none}
  }
</style>
</head>

  <script>
    (function(){
      var btn = document.getElementById('greetBtn');
      var reveal = document.getElementById('greetReveal');
      var msg = document.getElementById('greetMsg');

      btn.addEventListener('click', function(){
        msg.textContent = '반갑습니다!';
        reveal.classList.add('is-open');
        // 누를 때마다 말풍선이 다시 톡 튀어나오도록 애니메이션 재시작
        msg.classList.remove('pop');
        void msg.offsetWidth;
        msg.classList.add('pop');
      });
    })();
  </script>
